version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # faster-whisper 1.2.1 breaks on PyAV 17+ (see pyproject.toml); security
      # alerts still come. Drop this when faster-whisper supports a newer PyAV.
      - dependency-name: av
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
