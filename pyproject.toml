[project]
name = "reel-bot"
version = "0.1.0"
description = "Pipeline that writes, renders and posts short-form videos, with one human pick per video."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reel-bot = "reel_bot.cli:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12",
  "pip-audit>=2.9",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["skills/relay-notify"]

[tool.ruff.lint]
# Beyond the defaults: bugs, security, complexity, and no print() outside the CLI.
select = [
  "E", "W", "F", "I", "B", "UP", "S", "SIM", "PL", "RUF", "T20", "C90", "PT", "DTZ", "TRY", "ERA",
]
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/reel_bot/cli.py" = ["T201"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["reel_bot"]
branch = true
